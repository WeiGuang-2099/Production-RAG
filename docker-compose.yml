services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # In-network addresses override the localhost defaults copied from .env.example
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - KEYWORD_BACKEND=opensearch
      - OPENSEARCH_URL=http://opensearch:9200
    depends_on:
      qdrant:
        condition: service_healthy
      # service_started, not service_healthy: the API must start fine
      # without Redis (the cache falls back to in-memory)
      redis:
        condition: service_started
      # Same reasoning: a dead OpenSearch degrades the keyword leg to
      # vector-only, it must not block the API
      opensearch:
        condition: service_started
    volumes:
      - rag_data:/app/data
    restart: unless-stopped
    healthcheck:
      # python:3.11-slim ships no curl
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    # Persist the keyword index like the vectors: ingest tracking survives restarts,
    # so an index lost on restart would never be rebuilt
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:v1.18.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      # The qdrant image has no curl or wget; bash can still open the port
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  qdrant_data:
  opensearch_data:
  rag_data:
